services:
  mysql:
    image: mysql:8.4
    container_name: korea-tarot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: korea_tarot
      MYSQL_USER: korea_tarot
      MYSQL_PASSWORD: korea_tarot_dev
      MYSQL_ROOT_PASSWORD: root_dev_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: korea-tarot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:

