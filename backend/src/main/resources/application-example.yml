spring:
  datasource:
    url: jdbc:mysql://localhost:3306/korea_tarot?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: korea_tarot
    password: change-me
  data:
    redis:
      host: localhost
      port: 6379

app:
  auth:
    jwt-secret: change-this-local-development-jwt-secret-at-least-32-bytes
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  ai:
    base-url: http://localhost:8000
    stream-path: /internal/v1/interpretations/stream
    timeout-seconds: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
